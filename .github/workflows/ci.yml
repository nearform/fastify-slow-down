name: Continuous Integration
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --entrypoint redis-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: |
          npm ci
          npm run lint
          npm test
  smoke:
    name: Install smoke (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # npm ci so `npm pack`'s prepare (husky) runs; the smoke then packs the
      # package, installs it into a clean consumer, imports it, and registers it
      # on a real Fastify instance (test/smoke-usage.mjs).
      # --no-engine-strict: match fastify v5, which supports node 20 despite a
      # transitive cookie@2 advising node >=22 (an install warning, not a break).
      - run: npm ci
      - run: node test/smoke.mjs . --consumer-deps "fastify@5" --no-engine-strict --script test/smoke-usage.mjs
  automerge:
    name: Merge dependabot's PRs
    needs: [test, smoke]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: fastify/github-action-merge-dependabot@v3
